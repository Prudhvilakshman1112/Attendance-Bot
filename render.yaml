services:
  - type: web
    name: vignan-attendance-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py bot:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BASE_URL
        value: https://webprosindia.com/vignanit/
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RENDER_EXTERNAL_URL
        value: https://vignan-attendance-bot.onrender.com
