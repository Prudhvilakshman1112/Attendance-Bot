<script language="javascript" type="text/javascript">
    $(document).bind("contextmenu", function () { return false; });
function _onEmpKeyPress()
{
    if(event.keyCode==13)
        $("#"+ "imgBtn1").click();
}
function _onStudentKeyPress()
{
    if(event.keyCode==13)
        $("#" +"imgBtn2").click();
}
    function encryptJSText(mode) {
        var plaintext = "";
        if (mode == 1)
            plaintext = $("#" + "txtPwd1").val();
        else if (mode == 2)
            plaintext = $("#" + "txtPwd2").val();
        else if (mode == 3)
            plaintext = $("#" + "txtPwd3").val();

        var key = CryptoJS.enc.Utf8.parse('8701661282118308'); //CryptoJS.enc.Utf8.parse('8080808080808080');
        var iv = CryptoJS.enc.Utf8.parse('8701661282118308');
        var encrypteddata = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse(plaintext), key,
            { keySize: 128 / 8, iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
        if (mode == 1)
            $("#" + "hdnpwd1").val(encrypteddata);
        else if (mode == 2)
            $("#" + "hdnpwd2").val(encrypteddata);
        else if (mode == 3)
            $("#" + "hdnpwd3").val(encrypteddata);
        //return encrypteddata;
    }
    function setValue(m) {
        if (m == 1)
            $("#" + "txtPwd1").val($("#" + "hdnpwd1").val());
        else if (m == 2)
            $("#" + "txtPwd2").val($("#" + "hdnpwd2").val());
        else if (m == 3)
            $("#" + "txtPwd3").val($("#" + "hdnpwd3").val());
    }
